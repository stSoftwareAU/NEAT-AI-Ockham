# Quality bar aligned with NEAT-AI-scorer (fmt, clippy, tests, security, spell & shell checks).
#
# Job dependency graph:
#
#   validation ──┬── quality ─────────────┐
#                │                         │
#                └── security ─────────────┤
#                                          ├──► ci-required  (aggregator)
#   shell-checks ──────────────────────────┤
#   spell-check ───────────────────────────┤
#   version-increment ─────────────────────┘
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      # Milestone branches carry the same required checks as Develop, so PRs
      # from issue branches into a milestone must run CI too (Issue #89).
      - "milestone/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  quality:
    name: Quality Checks
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust workspace (toolchain)
        uses: ./.github/actions/setup-rust-workspace
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-deny (prebuilt binary)
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          tool: cargo-deny

      - name: Move the NEAT-AI family pins as the version-increment job will
        # `version-increment` moves the neat-core pin to core's newest release
        # and pushes it; when that push starts no new run (a push made with the
        # default GITHUB_TOKEN never does), this job is the only build the
        # moved pin gets before it merges. Moving it here too — uncommitted —
        # keeps "the CI build fails on a breaking core release" true in the
        # same run (Issue #210). A pin already current is a silent exit 0.
        run: ./scripts/family-pins.sh

      - name: cargo deny
        run: cargo deny check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run linter
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::filter_next \
            -D clippy::collapsible_if

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace --all-features --verbose -- --test-threads=2

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  security:
    needs: [validation]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/security.yml
    if: github.event_name == 'pull_request'
    with:
      include-dependency-review: false

  validation:
    name: Project Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Set up Rust workspace (toolchain)
        uses: ./.github/actions/setup-rust-workspace

      - name: Check for required files
        run: |
          set -euo pipefail
          required_files=(
            "Cargo.toml"
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "quality.sh"
            "scripts/runlib.sh"
            "deny.toml"
            "rust-toolchain.toml"
            "ockham/src/main.rs"
            ".github/CODEOWNERS"
            "SECURITY.md"
            "scripts/family-pins.sh"
          )
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done
          if [ ${#missing_files[@]} -ne 0 ]; then
            echo "Missing required files: ${missing_files[*]}"
            exit 1
          fi

      - name: Validate Cargo workspace
        run: cargo metadata --no-deps --format-version 1 > /dev/null

  version-increment:
    name: Auto-increment Version
    # The unattended machines rebuild only when the crate version changes, so a
    # PR that lands code at an unchanged version ships nothing. Bump it here
    # when the author has not (Issue #45).
    #
    # Fork PRs are skipped: this workflow cannot push to a fork's branch, and a
    # skipped job counts as OK in `ci-required`. The bump then rides the
    # maintainer's own follow-up branch.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # The push token is never persisted into .git/config, where any later
          # build script could read it; it is supplied per step instead.
          persist-credentials: false

      - name: Refresh the canonical NEAT-AI-core scripts
        # `scripts/runlib.sh` (NEAT-AI-core#680, Issue #209) and
        # `scripts/family-pins.sh` (NEAT-AI-core#681, Issue #210) each have one
        # home — NEAT-AI-core `Develop`. Neither is ever edited here: a stale
        # copy is overwritten from core and rides the single commit this job
        # already pushes, so the refresh never races the bump.
        env:
          CORE_REF: Develop
          CORE_REPO: stSoftwareAU/NEAT-AI-core
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for file in scripts/runlib.sh scripts/family-pins.sh; do
            fetched="${RUNNER_TEMP}/core-$(basename "$file")"
            if ! gh api "repos/${CORE_REPO}/contents/${file}?ref=${CORE_REF}" \
              -H "Accept: application/vnd.github.raw" >"$fetched"; then
              echo "Cannot fetch ${file} from ${CORE_REPO}@${CORE_REF}" >&2
              exit 1
            fi
            # An error page or an empty body would otherwise be copied over the
            # working script and only fail much later, somewhere else. The test
            # is "a script bash can parse", not core's exact first line: core is
            # free to change its shebang without hard-failing every PR here.
            if [ ! -s "$fetched" ] || ! head -n 1 "$fetched" | grep -q '^#!' ||
              ! bash -n "$fetched"; then
              echo "Fetched ${CORE_REPO}@${CORE_REF} ${file} is not a bash script" >&2
              exit 1
            fi
            if cmp -s "$fetched" "$file"; then
              echo "${file} already matches ${CORE_REPO}@${CORE_REF}"
              continue
            fi
            echo "Refreshing ${file} from ${CORE_REPO}@${CORE_REF}"
            cp "$fetched" "$file"
            chmod +x "$file"
            # The new bytes are gated *here*, where they arrive. A push made with
            # the default GITHUB_TOKEN starts no new workflow run, so the
            # `shell-checks` job of this run only ever saw the pre-refresh
            # checkout — without this, a refreshed script could merge ungated.
            shellcheck --severity=warning -s bash "$file"
            case "$file" in
              scripts/runlib.sh) ./scripts/test-runlib.sh </dev/null ;;
              scripts/family-pins.sh) ./scripts/family-pins.sh --help >/dev/null ;;
            esac
          done

      - name: Set up Rust workspace (toolchain)
        uses: ./.github/actions/setup-rust-workspace

      - name: Move the NEAT-AI family pins to the latest release
        # The neat-core pin in ockham/Cargo.toml moves only through this
        # repository's own PRs, and this is where: the canonical
        # scripts/family-pins.sh rewrites the tag to core's newest released
        # `v*` and runs `cargo update --package neat-core` so Cargo.lock
        # follows, before the bump, so a moved pin always lands in the one
        # commit this job pushes (Issue #210). Its stderr is kept for that
        # commit's message. A pin already current is a silent exit 0; a
        # remote that cannot be listed fails the job, and `ci-required`
        # blocks the merge rather than letting a stale pin through.
        run: |
          set -euo pipefail
          if ! ./scripts/family-pins.sh 2>"${RUNNER_TEMP}/family-pins.log"; then
            cat "${RUNNER_TEMP}/family-pins.log" >&2
            echo "scripts/family-pins.sh failed — the neat-core pin cannot be trusted" >&2
            exit 1
          fi
          cat "${RUNNER_TEMP}/family-pins.log" >&2

      - name: Bump the crate version when this PR has not already
        env:
          BASE_REF: ${{ github.base_ref }}
          PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --no-tags "$remote" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if git cat-file -e "origin/${BASE_REF}:ockham/Cargo.toml" 2>/dev/null; then
            git show "origin/${BASE_REF}:ockham/Cargo.toml" > "${RUNNER_TEMP}/base-Cargo.toml"
            base="$(./scripts/auto-version.sh --print "${RUNNER_TEMP}/base-Cargo.toml")"
          else
            echo "Bootstrap: base branch has no ockham/Cargo.toml — treating version as 0.0.0"
            base="0.0.0"
          fi
          ./scripts/auto-version.sh ockham/Cargo.toml "$base" Cargo.lock

      # One commit, one push: the bump, any moved pin and any refreshed script
      # travel together, so none of them can race the others onto the branch.
      - name: Commit and push the bump, moved pins and refreshed scripts
        env:
          HEAD_REF: ${{ github.head_ref }}
          PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- ockham/Cargo.toml Cargo.lock scripts/runlib.sh scripts/family-pins.sh; then
            echo "Version is already ahead of ${GITHUB_BASE_REF}, the family pins are current and the canonical scripts match core — nothing to commit"
            exit 0
          fi
          bumped=0
          if git diff -- ockham/Cargo.toml | grep -q '^+version = '; then
            bumped=1
          fi
          # One line per pin moved, as family-pins.sh printed them.
          moved="$(grep '^\[family-pins\] .* → ' "${RUNNER_TEMP}/family-pins.log" 2>/dev/null || true)"
          refreshed=""
          for file in scripts/runlib.sh scripts/family-pins.sh; do
            if ! git diff --quiet -- "$file"; then
              refreshed="${refreshed:+${refreshed}, }${file}"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ockham/Cargo.toml Cargo.lock scripts/runlib.sh scripts/family-pins.sh
          if [ "$bumped" -eq 1 ]; then
            version="$(./scripts/auto-version.sh --print ockham/Cargo.toml)"
            subject="🪒 auto-increment crate version to ${version}"
          elif [ -n "$moved" ]; then
            subject="🪒 move the NEAT-AI family pins to the latest release"
          else
            subject="🪒 refresh the canonical NEAT-AI-core scripts"
          fi
          body=""
          if [ -n "$moved" ]; then
            body="${moved}"$'\n'"(Issue #210)"
          fi
          if [ -n "$refreshed" ]; then
            body="${body:+${body}$'\n\n'}Refresh ${refreshed} from NEAT-AI-core Develop (Issue #209)."
          fi
          if [ -n "$body" ]; then
            git commit -m "$subject" -m "$body"
          else
            git commit -m "$subject"
          fi
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPOSITORY}.git" \
            "HEAD:${HEAD_REF}"

  shell-checks:
    name: Shell Script Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Check bash script syntax
        run: |
          set -euo pipefail
          EXIT_CODE=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "OK $script"
            else
              echo "FAIL $script"
              EXIT_CODE=1
            fi
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          exit $EXIT_CODE

      - name: Run ShellCheck
        env:
          SHELLCHECK_OPTS: -s bash
        run: |
          set -euo pipefail
          shellcheck --version
          scripts=()
          while IFS= read -r script; do
            scripts+=("$script")
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to lint"
            exit 0
          fi
          shellcheck --severity=warning "${scripts[@]}"

      - name: Check the canonical scripts/runlib.sh contract
        run: ./scripts/test-runlib.sh

      - name: Check the CI step that refreshes scripts/runlib.sh
        run: ./scripts/test-runlib-refresh.sh

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Install codespell
        run: pip install --user codespell

      - name: Run codespell preflight
        run: ./scripts/spell-check.sh

  ci-required:
    name: CI Required Checks
    needs:
      [validation, quality, security, shell-checks, spell-check, version-increment]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all gating jobs succeeded
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SHELL_CHECKS_RESULT: ${{ needs.shell-checks.result }}
          SPELL_CHECK_RESULT: ${{ needs.spell-check.result }}
          VERSION_INCREMENT_RESULT: ${{ needs.version-increment.result }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" result="$2"
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              echo "OK   $name: $result"
            else
              echo "FAIL $name: $result" >&2
              fail=1
            fi
          }
          check "validation"   "$VALIDATION_RESULT"
          check "quality"      "$QUALITY_RESULT"
          check "security"     "$SECURITY_RESULT"
          check "shell-checks" "$SHELL_CHECKS_RESULT"
          check "spell-check"  "$SPELL_CHECK_RESULT"
          check "version-increment" "$VERSION_INCREMENT_RESULT"
          if [[ "$fail" -ne 0 ]]; then
            echo "One or more gating jobs did not succeed — blocking merge." >&2
            exit 1
          fi
          echo "All gating jobs succeeded — safe to merge."
