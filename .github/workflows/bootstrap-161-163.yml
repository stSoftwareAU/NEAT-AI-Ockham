name: Bootstrap issues 161 and 163

on:
  push:
    branches:
      - fix/161-163-rescan-telemetry

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/161-163-rescan-telemetry
          fetch-depth: 0

      - name: Set up Rust workspace
        uses: ./.github/actions/setup-rust-workspace

      - name: Apply source patch
        run: |
          python3 scripts/apply-161-163.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ockham/src/coverage.rs')
          text = p.read_text()

          old = '#[derive(Debug, Clone, Copy, PartialEq, Eq, Default, Serialize, Deserialize)]\n#[serde(rename_all = "camelCase")]\npub struct Passes {'
          new = '#[derive(Debug, Clone, Copy, PartialEq, Default, Serialize, Deserialize)]\n#[serde(rename_all = "camelCase")]\npub struct Passes {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Passes derive, found {text.count(old)}')
          text = text.replace(old, new, 1)

          for old in (
              '    visited: HashSet<String>,\n',
              '            visited: HashSet::new(),\n',
              '        self.visited.insert(uuid.to_string());\n',
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'expected one obsolete distinct-visit fragment, found {text.count(old)}: {old!r}')
              text = text.replace(old, '', 1)

          old = '''    /// Distinct visit keys the sweep reached this run, retained for coverage
    /// diagnostics that still care about uniqueness.
    pub(crate) fn visited(&self) -> usize {
        self.visited.len()
    }

    /// Distinct visit keys already checked when the run opened.
    pub(crate) fn revisited(&self) -> usize {
        self.visited
            .iter()
            .filter(|uuid| self.opening.contains(*uuid))
            .count()
    }

'''
          if text.count(old) != 1:
              raise SystemExit(f'expected obsolete distinct-visit methods once, found {text.count(old)}')
          text = text.replace(old, '', 1)
          p.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Remove bootstrap machinery
        run: rm -f scripts/apply-161-163.py .github/workflows/bootstrap-161-163.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🪒 report topology-tolerant rescan work and synapse visits (#161 #163) [bootstrap-done]"
          git push origin HEAD:fix/161-163-rescan-telemetry
