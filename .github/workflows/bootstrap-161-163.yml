name: Bootstrap issues 161 and 163

on:
  push:
    branches:
      - fix/161-163-rescan-telemetry

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-done]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/161-163-rescan-telemetry
          fetch-depth: 0

      - name: Set up Rust workspace
        uses: ./.github/actions/setup-rust-workspace

      - name: Apply source patch
        run: |
          python3 scripts/apply-161-163.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ockham/src/coverage.rs')
          text = p.read_text()

          old = '#[derive(Debug, Clone, Copy, PartialEq, Eq, Default, Serialize, Deserialize)]\n#[serde(rename_all = "camelCase")]\npub struct Passes {'
          new = '#[derive(Debug, Clone, Copy, PartialEq, Default, Serialize, Deserialize)]\n#[serde(rename_all = "camelCase")]\npub struct Passes {'
          if text.count(old) != 1:
              raise SystemExit(f'expected one Passes derive, found {text.count(old)}')
          text = text.replace(old, new, 1)

          for old in ('    visited: HashSet<String>,\n', '            visited: HashSet::new(),\n', '        self.visited.insert(uuid.to_string());\n'):
              if text.count(old) != 1:
                  raise SystemExit(f'expected one obsolete fragment, found {text.count(old)}: {old!r}')
              text = text.replace(old, '', 1)

          pattern = r'    /// Distinct visit keys the sweep reached this run, retained for coverage\n.*?(?=    /// Every visit attempt this run, including repeats after sweep rebuilds\.)'
          text, n = re.subn(pattern, '', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'expected one obsolete distinct-helper block, found {n}')

          # Passes::new is retained for old artefact/report fixtures. It cannot
          # know a population denominator, so leave the additive measured fields
          # empty instead of fabricating a 0.00 equivalent-pass measurement.
          old = '''            visits_run: visited_run,
            neuron_visits_run: visited_run,
            synapse_visits_run: 0,
            revisit_attempts_run: revisited_run,
            neuron_revisits_run: revisited_run,
            synapse_revisits_run: 0,
            equivalent_passes_run: 0.0,
'''
          new = '''            visits_run: 0,
            neuron_visits_run: 0,
            synapse_visits_run: 0,
            revisit_attempts_run: 0,
            neuron_revisits_run: 0,
            synapse_revisits_run: 0,
            equivalent_passes_run: 0.0,
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected compatibility constructor fields once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          # Measured runs render the new attempt/per-kind lines. Legacy
          # constructors still render their old visit line, but the pass line is
          # explicitly named strict in both paths.
          needle = '''        if self.visits_run > 0 {
            out.push(format!(
                "{:<11}{:.2} creature-equivalent this run · {} visit attempts",
                "rescan:", self.equivalent_passes_run, self.visits_run
            ));
            if self.synapse_visits_run > 0 {
                out.push(format!(
                    "{:<11}neurons {} ({} revisits) · synapses {} ({} revisits)",
                    "visits:",
                    self.neuron_visits_run,
                    self.neuron_revisits_run,
                    self.synapse_visits_run,
                    self.synapse_revisits_run
                ));
            } else {
                out.push(format!(
                    "{:<11}neurons {} ({} revisits)",
                    "visits:", self.neuron_visits_run, self.neuron_revisits_run
                ));
            }
        }
'''
          replacement = needle[:-2] + ''' else if self.visited_run > 0 {
            out.push(format!(
                "{:<11}{} hidden neurons visited this run · {} revisited",
                "visits:", self.visited_run, self.revisited_run
            ));
        }
'''
          if text.count(needle) != 1:
              raise SystemExit(f'expected measured rendering block once, found {text.count(needle)}')
          text = text.replace(needle, replacement, 1)

          replacements = {
              '    fn visits_count_every_uuid_reached_while_progress_counts_only_new_ones() {':
                  '    fn visit_attempts_count_repeat_work_while_progress_counts_only_new_keys() {',
              '        assert_eq!(progress.visited(), 0);':
                  '        assert_eq!(progress.visit_counts().total, 0);',
              '            progress.visited(),\n            3,\n            "a uuid is visited once, however often"':
                  '            progress.visit_counts().total,\n            4,\n            "repeat visits are real work and stay counted"',
              '        assert_eq!(progress.revisited(), 2, "h_a and h_b were already checked");':
                  '        assert_eq!(progress.revisit_counts().total, 3, "two h_a visits plus h_b were revisits");',
              '        assert_eq!(progress.revisited(), 2, "the new uuid is not a revisit");':
                  '        assert_eq!(progress.revisit_counts().total, 3, "the new uuid is not a revisit");',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one test fragment, found {text.count(old)}: {old!r}')
              text = text.replace(old, new, 1)

          # Existing exact-text tests now name the strict metric explicitly.
          for old, new in (
              ('passes:    7 complete this epoch · 1 this run · pass 8 in progress', 'passes:    7 strict complete this epoch · 1 strict this run · pass 8 in progress'),
              ('passes:    4 complete this epoch · 2 this run · pass 5 in progress', 'passes:    4 strict complete this epoch · 2 strict this run · pass 5 in progress'),
              ('passes:    0 complete this epoch · 0 this run · pass 1 in progress', 'passes:    0 strict complete this epoch · 0 strict this run · pass 1 in progress'),
          ):
              if old not in text:
                  raise SystemExit(f'missing expected pass fixture: {old}')
              text = text.replace(old, new)

          p.write_text(text)

          p = Path('ockham/src/run.rs')
          text = p.read_text()
          old = 'passes:    3 complete this epoch · 3 this run · pass 4 in progress'
          new = 'passes:    3 strict complete this epoch · 3 strict this run · pass 4 in progress'
          if text.count(old) != 1:
              raise SystemExit(f'expected run pass fixture once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '        assert!(text.contains("visits:"), "{text}");\n'
          addition = '''        assert!(text.contains("rescan:    3.33 creature-equivalent this run · 20 visit attempts"), "{text}");
        assert!(text.contains("visits:    neurons 8 (0 revisits) · synapses 12 (0 revisits)"), "{text}");
'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected run visits assertion once, found {text.count(marker)}')
          text = text.replace(marker, addition, 1)
          p.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Remove bootstrap machinery
        run: rm -f scripts/apply-161-163.py .github/workflows/bootstrap-161-163.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🪒 report topology-tolerant rescan work and synapse visits (#161 #163) [bootstrap-done]"
          git push origin HEAD:fix/161-163-rescan-telemetry
