name: Cargo Quality

# Standalone Cargo Format and Clippy workflow (Issue #66).
#
# Why a dedicated workflow when ci.yml already runs fmt + clippy?
#   * ci.yml only triggers on PRs against `Develop` and `milestone/**`. This
#     workflow covers every OTHER base, so feature branches and stacked PRs
#     still get fmt and clippy coverage. It ignores `Develop`, so a PR into
#     `Develop` runs fmt + clippy once (in ci.yml's `quality` job) rather
#     than twice (Issue #243). `milestone/**` is deliberately NOT ignored:
#     the fleet's milestone-filter check (BP-MILESTONE-FILTER) requires every
#     quality workflow to run on milestone PRs, so those still run both. The
#     `branches-ignore` list must equal ci.yml's non-milestone `branches`;
#     `ockham/tests/workflow_overlap.rs` enforces that.
#   * Keeps a small, fast, single-purpose gate that is cheap to re-run
#     when iterating on style or lint fixes.
#
# Coverage is intentionally NOT uploaded here — the suggested template
# from the workflow-sync issue includes a Codecov step, but this repo
# has no `CODECOV_TOKEN` configured and adding `codecov/codecov-action`
# would also require a new entry in
# `scripts/check-workflow-action-versions.sh`. Coverage upload should be
# tracked as its own follow-up (see Issue #1636 referenced in the
# template) rather than smuggled in under the fmt + clippy banner.

on:
  pull_request:
    branches-ignore: [Develop]
  workflow_dispatch:

permissions:
  contents: read

# Avoid duplicate scheduled / dispatch runs piling up; PR runs are deduped
# per-branch.
concurrency:
  group: cargo-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  quality:
    name: Cargo Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # This job only runs fmt + clippy — it never pushes back to the repo
          # nor fetches a private submodule, so the GITHUB_TOKEN must not be
          # persisted to .git/config where a later step could read it (#374).
          persist-credentials: false

      # `neat-core` is a released git tag Cargo fetches itself (Issue #210), so
      # `cargo fmt --all` and `cargo clippy` resolve the workspace with nothing
      # staged beside it. The toolchain pin (Issue #126) lives in the shared
      # composite action.
      - name: Set up the Rust toolchain
        uses: ./.github/actions/setup-rust-workspace
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-quality-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-quality-
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          set -euo pipefail
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::filter_next \
            -D clippy::collapsible_if
