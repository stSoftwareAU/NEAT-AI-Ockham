name: Set up Rust workspace
description: >-
  Install the pinned Rust toolchain for this workspace. Single source of truth
  for the preamble every Cargo job in this repository repeats (Issue #126).

  No sibling checkout: since Issue #210 `ockham/Cargo.toml` pins `neat-core` to
  a released git tag, so Cargo fetches core itself and nothing beside the
  repository has to exist for the workspace to resolve.

inputs:
  components:
    description: >-
      Comma-separated rustup components to install alongside the toolchain
      (e.g. "rustfmt, clippy"). Empty installs the toolchain on its own.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # An empty `components` is exactly what an omitted `components:` produced
    # before, so a caller needing no extra component keeps its toolchain-only
    # install.
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18
      with:
        components: ${{ inputs.components }}
