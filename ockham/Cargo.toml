[package]
name = "neat_ai_ockham"
version = "0.1.77"
edition = "2024"
license = "Apache-2.0"
description = "Experimental pruning optimiser for already-fit NEAT-AI creatures."
repository = "https://github.com/stSoftwareAU/NEAT-AI-Ockham"
readme = "../README.md"

[lints]
workspace = true

# No explicit [lib]/[[bin]] tables: cargo's defaults already name both targets
# `neat_ai_ockham` from src/lib.rs and src/main.rs. Spelling them out made the
# manifest ambiguous to scripts/runlib.sh, whose no-cargo fast path declines
# any manifest carrying an explicit [[bin]] — so an already-installed run paid
# for a `cargo metadata` call it does not need (Issue #209).

[dependencies]
# neat-core is pinned to a NEAT-AI-core release tag (Issue #210). The pin moves
# only through this repository's own PRs: the `version-increment` job runs the
# canonical scripts/family-pins.sh, which rewrites the tag to core's newest
# released `v*` and lets Cargo.lock follow, in the one commit that job pushes.
# Keep the declaration on a single line — that is the form family-pins.sh
# rewrites; a pin spread over several lines is refused, not skipped. To build
# against a local core checkout instead, override it with a [patch] in a
# `.cargo/config.toml` outside this repository (see CONTRIBUTING.md), never in
# a tracked file: core's downstream-consumer gate refuses a consumer carrying one.
neat-core = { git = "https://github.com/stSoftwareAU/NEAT-AI-core", tag = "v0.22.1" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Graceful SIGINT/SIGTERM cancellation. Unix-only crate; the handler is
# installed behind `cfg(unix)`.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
