[package]
name = "neat_ai_ockham"
version = "0.1.78"
edition = "2024"
license = "Apache-2.0"
description = "Experimental pruning optimiser for already-fit NEAT-AI creatures."
repository = "https://github.com/stSoftwareAU/NEAT-AI-Ockham"
readme = "../README.md"

[lints]
workspace = true

# No explicit [lib]/[[bin]] tables: cargo's defaults already name both targets
# `neat_ai_ockham` from src/lib.rs and src/main.rs. Spelling them out made the
# manifest ambiguous to scripts/runlib.sh, whose no-cargo fast path declines
# any manifest carrying an explicit [[bin]] — so an already-installed run paid
# for a `cargo metadata` call it does not need (Issue #209).

[dependencies]
# neat-core is consumed as a released git tag, never as a sibling path: the pin
# moves only through this repository's own PR, where `scripts/family-pins.sh`
# refreshes it to core's latest release and CI judges the result (Issue #210).
# Keep it on one line — that is the form family-pins.sh rewrites.
neat-core = { git = "https://github.com/stSoftwareAU/NEAT-AI-core", tag = "v0.22.4" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Graceful SIGINT/SIGTERM cancellation. Unix-only crate; the handler is
# installed behind `cfg(unix)`.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
